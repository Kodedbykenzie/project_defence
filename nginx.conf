# Imari — React SPA nginx configuration
# Serves the frontend built by Vite
# Handles client-side routing (React Router pushState/redirects)

events {}
http {
    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # Upstream for the backend API
    upstream imari_backend {
        server backend:4000;  # Docker network hostname
        # For production/Railway, use: server https://your-backend.up.railway.app;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve static files from the React app
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Set cache headers for static assets
        location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            try_files $uri =404;
        }

        # API proxy to backend
        location /v1/ {
            proxy_pass http://imari_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # SPA fallback — serve index.html for all other routes
        # This handles React Router client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}