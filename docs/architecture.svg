<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#0f172a" rx="12"/>
  <text x="450" y="38" fill="#e2e8f0" font-size="18" font-weight="bold" text-anchor="middle">Imari — system topology</text>

  <!-- Browser -->
  <rect x="300" y="60" width="300" height="80" rx="10" fill="#1e3a5f" stroke="#60a5fa"/>
  <text x="450" y="92" fill="#bfdbfe" font-size="15" font-weight="bold" text-anchor="middle">Browser (React SPA)</text>
  <text x="450" y="114" fill="#93c5fd" font-size="12" text-anchor="middle">Vite · Tailwind · ethers</text>

  <!-- Backend -->
  <rect x="60" y="220" width="320" height="110" rx="10" fill="#14532d" stroke="#4ade80"/>
  <text x="220" y="252" fill="#bbf7d0" font-size="15" font-weight="bold" text-anchor="middle">Backend (Fastify :4000)</text>
  <text x="220" y="274" fill="#86efac" font-size="12" text-anchor="middle">JWT auth · scoring · modules</text>
  <text x="220" y="294" fill="#86efac" font-size="12" text-anchor="middle">credential issuing · admin API</text>

  <!-- Postgres -->
  <rect x="300" y="390" width="300" height="70" rx="10" fill="#78350f" stroke="#fbbf24"/>
  <text x="450" y="420" fill="#fde68a" font-size="15" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  <text x="450" y="442" fill="#fcd34d" font-size="12" text-anchor="middle">local / Supabase · triggers · RLS</text>

  <!-- Chain -->
  <rect x="520" y="220" width="320" height="110" rx="10" fill="#4c1d95" stroke="#c084fc"/>
  <text x="680" y="252" fill="#e9d5ff" font-size="15" font-weight="bold" text-anchor="middle">Ethereum</text>
  <text x="680" y="274" fill="#d8b4fe" font-size="12" text-anchor="middle">dev: Hardhat :8545 (31337)</text>
  <text x="680" y="294" fill="#d8b4fe" font-size="12" text-anchor="middle">prod: Sepolia (11155111)</text>

  <!-- Contract -->
  <rect x="540" y="350" width="280" height="70" rx="10" fill="#3b0764" stroke="#a855f7"/>
  <text x="680" y="382" fill="#f3e8ff" font-size="13" font-weight="bold" text-anchor="middle">ImariCredentialRegistry</text>
  <text x="680" y="404" fill="#c4b5fd" font-size="11" text-anchor="middle">issue · revoke · reinstate · verify</text>

  <!-- Arrows -->
  <line x1="450" y1="140" x2="220" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="180" fill="#94a3b8" font-size="11">HTTPS / JSON (/v1)</text>
  <line x1="450" y1="140" x2="680" y2="220" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="180" fill="#94a3b8" font-size="11">eth_* JSON-RPC (read)</text>
  <line x1="220" y1="330" x2="400" y2="390" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="370" fill="#94a3b8" font-size="11">SQL</text>
  <line x1="380" y1="275" x2="520" y2="275" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="265" fill="#4ade80" font-size="11">ethers tx</text>
  <line x1="680" y1="330" x2="680" y2="350" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
